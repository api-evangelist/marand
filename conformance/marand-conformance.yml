source: https://marand.com/en/about
provider: Marand Software (Marand d.o.o., Ljubljana, Slovenia)
summary: >-
  Marand is a TM Forum member that builds cloud-native Open Digital Architecture (ODA)
  components for communications service providers. Its conformance posture is expressed
  entirely through TM Forum programs — Open API conformance certification per TMF API,
  "Ready for ODA" status for the product line, and the SID Information Framework as the
  data model — rather than through a first-party developer program. Marand publishes no
  public API reference or machine-readable specification of its own; the contracts its
  products implement are the TM Forum Open API specifications, which TM Forum publishes.
  Two conformance certification reports are publicly downloadable from TM Forum's
  conformance store and are cited verbatim below. ISO certification numbers were read
  from the SIQ certification badge Marand serves on its own site.

domain_standard:
  market: Telecom BSS / OSS — communications service providers
  standard: TM Forum Open API (Open Digital Architecture)
  declared: true
  signature: >-
    TMF-numbered Open API implementations (TMF620, TMF633, TMF673) certified under the
    TM Forum Open API Conformance program, plus "Ready for ODA" product-line status and
    the TM Forum Information Framework (SID) as the underlying information model.
  note: >-
    This is the domain standard for this provider's market. It is asserted by TM Forum's
    own published certification reports, not only by a marketing page. No first-party
    OpenAPI is published by Marand, so the standard is evidenced by certification records
    rather than by a fetchable contract on a Marand host.
  evidence:
    - url: https://s3.us-east-1.amazonaws.com/tmf-sfdc-public/Conformance/CON-01460/Marand-Certification%20Report-TMF633%20API-Mar2022.pdf
      status: 200
    - url: https://s3.us-east-1.amazonaws.com/tmf-sfdc-public/Conformance/CON-01846/Marand-Certification%20Report-TMF673%20API-May2023.pdf
      status: 200

