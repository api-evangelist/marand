aid: marand
name: Marand
description: >-
  Marand Software (Marand d.o.o., Ljubljana, Slovenia) builds cloud-native Business
  Support System components for communications service providers, positioned as a vendor
  of TM Forum Open Digital Architecture (ODA) components. Its product line covers a
  Unified Product Catalog, 360 Customer / Inventory, CPQ, CRM, Multiservice Enterprise
  Billing, AI/ML solutions and custom software services. Marand's components implement
  the TM Forum Information Framework (SID) and expose TM Forum Open APIs; the company is
  a TM Forum Open API Gold certified member, holds Open API conformance certifications
  for TMF633 (Service Catalog Management, 2022) and TMF673 (Geographic Address
  Management, 2023), achieved "Ready for ODA" status in March 2024, and co-authored the
  TMF760 Product Configuration API with Orange and Amdocs as one of the first
  fifth-generation TM Forum Open APIs. Marand publishes no public developer portal, API
  reference or machine-readable specification of its own — its APIs ship inside licensed
  components deployed at operator customers, and the contracts they implement are the TM
  Forum specifications.
